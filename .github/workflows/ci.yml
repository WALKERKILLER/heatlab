name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Compile sources
        run: python -m compileall -q src tests

      - name: Ruff lint
        run: ruff check src tests

      - name: Pytest
        run: pytest

      - name: Import smoke
        run: |
          python -c "import heatlab; print(heatlab.__version__)"
          python -c "from heatlab.web.app import create_app; app = create_app(); c = app.test_client(); r = c.get('/api/health'); assert r.status_code == 200, r.data"
