name: build-windows-web

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packaging dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Build one-click Web desktop executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name HeatLab-Web `
            --paths src `
            --add-data "src/heatlab/web/templates;heatlab/web/templates" `
            --add-data "src/heatlab/web/static;heatlab/web/static" `
            src/heatlab/web/launcher.py

      - name: Smoke test bundled Web backend
        shell: pwsh
        run: |
          $exe = "dist/HeatLab-Web.exe"
          if (-not (Test-Path $exe)) { Write-Error "missing $exe"; exit 1 }

          $port = 18765
          $proc = Start-Process -FilePath $exe -ArgumentList @("--no-browser", "--port", "$port") -PassThru
          try {
            $health = $null
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              try {
                $health = Invoke-WebRequest -Uri "http://127.0.0.1:$port/api/health" -TimeoutSec 2
                if ($health.StatusCode -eq 200) { break }
              } catch {
                Start-Sleep -Milliseconds 500
              }
            }
            if ($null -eq $health -or $health.StatusCode -ne 200) {
              Write-Error "bundled Web backend did not become healthy"
              exit 1
            }

            $healthPayload = $health.Content | ConvertFrom-Json
            if ($healthPayload.app -ne "heatlab-web") {
              Write-Error "unexpected health payload: $($health.Content)"
              exit 1
            }

            $page = Invoke-WebRequest -Uri "http://127.0.0.1:$port/" -TimeoutSec 5
            if ($page.Content -notmatch "HeatLab") {
              Write-Error "bundled index page did not render"
              exit 1
            }

            $stylesheet = Invoke-WebRequest -Uri "http://127.0.0.1:$port/static/app.css" -TimeoutSec 5
            if ($stylesheet.Content -notmatch "--text-strong") {
              Write-Error "bundled static assets did not render"
              exit 1
            }
            Write-Output "bundled Web backend smoke test passed"
          } finally {
            if (-not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Package one-click executable
        shell: pwsh
        run: |
          Compress-Archive -Path dist/HeatLab-Web.exe -DestinationPath HeatLab-Web-win64.zip -Force
          $item = Get-Item HeatLab-Web-win64.zip
          Write-Output "artifact: $($item.Name) $([math]::Round($item.Length / 1MB, 1)) MB"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HeatLab-Web-win64
          path: HeatLab-Web-win64.zip

      - name: Publish release (on tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: HeatLab-Web-win64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
