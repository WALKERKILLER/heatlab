name: build-windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Build Windows binary (merged window)
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --name HeatLab `
            --collect-all heatlab `
            src/heatlab/app.py

      - name: Smoke test (launch then auto-kill)
        shell: pwsh
        run: |
          $exe = "dist/HeatLab/HeatLab.exe"
          if (-not (Test-Path $exe)) { Write-Error "missing $exe"; exit 1 }
          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 15
          if ($proc.HasExited) {
            Write-Error "process exited early with rc=$($proc.ExitCode)"
            exit 1
          }
          Write-Output "still running after 15s: launch OK"
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue

      - name: Package zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/HeatLab -DestinationPath HeatLab-win64.zip -Force
          $item = Get-Item HeatLab-win64.zip
          Write-Output "artifact: $($item.Name) $([math]::Round($item.Length / 1MB, 1)) MB"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HeatLab-win64
          path: HeatLab-win64.zip

      - name: Publish release (on tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: HeatLab-win64.zip
          draft: false
          prerelease: true
          generate_release_notes: false
